# VirtualHost de ejemplo — SIGEL / Travel BQTO
# En Fastcomet el vhost ya es el dominio https://travelbqto.kontrolaonline.com/
# Este archivo se muestra al docente de SO y se puede pegar en la laptop de demo.

<VirtualHost *:80>
    ServerName travelbqto.kontrolaonline.com
    ServerAlias sigel.local
    DocumentRoot /home/travelbqto/public_html

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/sigel_error.log
    CustomLog ${APACHE_LOG_DIR}/sigel_access.log combined
</VirtualHost>
