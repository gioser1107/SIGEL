name: Pruebas SIGEL

on:
  workflow_dispatch:
  push:
    branches: [master, codex/pipeline-pruebas]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pruebas-sigel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruebas:
    name: Compilación, MySQL, API e interfaz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: SoloBaseEfimeraCI2026
          MYSQL_ROOT_HOST: '%'
          TZ: America/Caracas
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      TZ: America/Caracas
      DB_HOST: 127.0.0.1
      DB_PUERTO: ${{ job.services.mysql.ports[3306] }}
      DB_USUARIO: root
      DB_CONTRASENA: SoloBaseEfimeraCI2026
      DB_NOMBRE: sigel_ci_negocio
      DB_NOMBRE_SEGURIDAD: sigel_ci_seguridad
      SIGEL_QA_ADMIN_CORREO: qa.admin.ci@example.test
      SIGEL_QA_ADMIN_CLAVE: SoloDatosSinteticosCI2026!
      TASA_BCV_AUTO: '0'
      RESPALDO_AUTO: '0'
    steps:
      - name: Obtener código de esta versión
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias de pruebas y backend
        run: |
          python -m pip install -r backend/requirements.txt -r pruebas/ci/requirements.txt
          python -m pip freeze > /tmp/sigel-versiones-python.txt
      - name: Preparar navegador y cliente MySQL
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y mysql-client
      - name: Instalar dependencias del frontend
        run: npm ci --prefix frontend
      - name: Ejecutar pipeline completo
        run: python pruebas/ci/ejecutar.py
      - name: Conservar versiones y resumen de la ejecución
        if: always()
        run: |
          mkdir -p pruebas/resultados_pipeline
          cp /tmp/sigel-versiones-python.txt pruebas/resultados_pipeline/ 2>/dev/null || true
          git rev-parse HEAD > pruebas/resultados_pipeline/commit.txt
          if [ -f pruebas/resultados_pipeline/resumen.json ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('pruebas/resultados_pipeline/resumen.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Pruebas SIGEL\n\nResultado: **'+d['resultado']+'**\n\n')
              f.write('Compilación, 102 casos Pytest, 4 casos de interfaz y 7 reglas del asistente.\n\n')
              f.write('Los XML, logs y resumen están en el artefacto descargable. Aceptación humana y rendimiento no se certifican en este workflow.\n')
          PY
          fi
      - name: Guardar XML y evidencias incluso si hay fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-sigel-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            pruebas/resultados_pipeline/
            !pruebas/resultados_pipeline/.privado/**
          retention-days: 30
          if-no-files-found: error
